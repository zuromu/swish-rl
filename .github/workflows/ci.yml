name: CI

on:
  push:
    branches: [main]   # after every merge into main
  pull_request:        # on every PR, before merging

permissions:
  contents: read       # the workflow can read the repo and nothing more

jobs:
  check:
    name: Lint, type-check and test   # this becomes the status check's name
    runs-on: ubuntu-latest            # a fresh Linux machine for every run
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0

      - name: Install dependencies
        run: uv sync --locked

      - name: Check formatting
        run: uv run ruff format --check

      - name: Lint
        run: uv run ruff check --output-format=github

      - name: Type check
        run: uv run pyright

      - name: Run tests
        run: uv run pytest
